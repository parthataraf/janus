# Serve the built SPA. It's a single page, so any unknown path falls back to
# index.html (there's no client-side router today, but this keeps deep links and
# refreshes working if one is added). Caddy terminates TLS and handles /api in
# front of this, so nginx only serves static assets.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the fingerprinted assets; never cache the HTML shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
